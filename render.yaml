services:
  - type: web
    name: queuewise-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queuewise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.4

databases:
  - name: queuewise-db
    plan: free
    databaseName: queuewise
